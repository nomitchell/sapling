[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sapling-research"
version = "0.1.0"
description = "A local, recursive research organization with a human-accessible root coordinator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.38,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "httpx>=0.28,<1", "openai>=1.68,<3", "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2", "keyring>=25,<26", "beautifulsoup4>=4.13,<5", "pypdf>=5,<7", "ddgs>=9.16,<10",
  "fastembed>=0.8,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
sapling = "sapling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sapling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
